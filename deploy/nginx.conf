server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase header buffer for large X-Colorscale / X-Bbox response headers
    proxy_buffer_size          16k;
    proxy_buffers              4 16k;
    proxy_busy_buffers_size    32k;

    # FastAPI health check
    location /health {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Sentinel-2 overlay fetches can take 10–30 s
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # SPA fallback: serve index.html for any path that isn't a static asset
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
