name: boatops-iceland
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pillow
  - shapely        # satellite overpass footprints (celestrak.py)
  - requests
  - pyyaml
  - python-dotenv
  - pip
  - pip:
      - cachetools
      - suncalc
      - skyfield
      - sgp4
      - httpx
      - "fastapi>=0.115"
      - "uvicorn[standard]"
      - "pydantic-settings>=2.0"
