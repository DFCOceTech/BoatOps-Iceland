name: boatops
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - jupyter
  - jupyterlab
  - ipywidgets
  - ipyleaflet
  - nbmake
  - numpy
  - pandas
  - xarray
  - netcdf4
  - scipy
  - rasterio
  - shapely
  - pyproj
  - cartopy
  - matplotlib
  - requests
  - pyyaml
  - python-dotenv
  - pip
  - pip:
      - cachetools
      - cmocean
      - folium
      - suncalc
      - skyfield
      - sgp4
      - copernicusmarine
      - httpx
      - fastapi
      - uvicorn[standard]
      - pydantic-settings
      - anthropic
      - pip-audit
